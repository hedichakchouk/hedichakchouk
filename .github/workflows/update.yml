name: Update heatmap
on:
  schedule: [{cron: "0 3 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/gen_heatmap.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add assets/heatmap.svg
          git diff --cached --quiet || git commit -m "chore: refresh heatmap"
          git push
